# DRUGDIS: приложение и локальная Qwen одной командой.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from drugdis
#
# Что произойдёт: поднимется Ollama, скачается модель (первый раз ~4.7 ГБ), затем приложение
# выполнит все четыре сценария кейса и завершится. Модель хранится в томе ollama-models,
# повторные запуски её не скачивают.
#
# Отдельные запросы:
#   docker compose run --rm drugdis ask "Подбери белок-мишень для ацетазоламида"
#   docker compose run --rm drugdis doctor --deep      # самопроверка окружения
#
# Нужно около 6 ГБ свободной RAM под Qwen 7B. Если памяти мало, возьмите модель поменьше:
#   OLLAMA_MODEL=qwen2.5:3b-instruct docker compose up --build ...

name: drugdis

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${OLLAMA_MODEL}\""]
    restart: "no"

  drugdis:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      model-pull:
        condition: service_completed_successfully
    environment:
      DRUGDIS_LLM_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-300}
    volumes:
      # Результаты прогонов и кеш ответов баз остаются на хосте: их можно открыть и сравнить.
      - ./outputs:/app/outputs
      - ./data/cache:/app/data/cache
    restart: "no"

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    environment:
      DRUGDIS_LLM_PROVIDER: keyword
    entrypoint: ["/app/docker/entrypoint.sh", "pytest"]
    command: ["-q", "-p", "no:cacheprovider"]

volumes:
  ollama-models:
